# CI na PR (IMP-003): lint, typy, testy z progami pokrycia (TC-CI-001), sekrety (TC-SEC-004), podatności (TC-SEC-005).
# Wymagane statusy na `main`: lint, typecheck, unit, secrets, audit – patrz ops/runbooks/branch-protection.md.
name: pr

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Na PR uruchamiamy tylko pakiety dotknięte zmianą i ich zależne.
  TURBO_FILTER: ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck $TURBO_FILTER

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # TC-CI-001: spadek pokrycia poniżej progu (vitest.config.ts) przerywa job.
      - run: pnpm turbo run test test:coverage $TURBO_FILTER
      - name: Komentarz z pokryciem – @polechamp/scoring
        if: always() && github.event_name == 'pull_request' && hashFiles('packages/scoring/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: '@polechamp/scoring'
          working-directory: packages/scoring
      - name: Komentarz z pokryciem – @polechamp/api
        if: always() && github.event_name == 'pull_request' && hashFiles('apps/api/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: '@polechamp/api'
          working-directory: apps/api

  # IMP-500 (TC-PERF-004): Reassure – baza z gałęzi docelowej, pomiar PR, próg scripts/reassure-gate.mjs
  # (więcej renderów albo czas > +10% przerywa job).
  perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter=@polechamp/mobile^...
      - run: pnpm --filter @polechamp/mobile perf:test -- --baseline
      - run: git checkout --force ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter=@polechamp/mobile^...
      - run: pnpm --filter @polechamp/mobile perf:test -- --branch ${{ github.head_ref }}
      - run: node scripts/reassure-gate.mjs
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reassure
          path: apps/mobile/.reassure/output.md

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # TC-SEC-004: gitleaks na całej historii; wyjątki tylko w .gitleaks.toml.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # TC-SEC-005: podatność high/critical w zależnościach produkcyjnych blokuje PR.
      - run: pnpm audit --prod --audit-level high

  # IMP-004: testy integracyjne na prawdziwym PostgreSQL 18 i Valkey (Testcontainers) dla zmian w API i pakietach.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'packages/scoring/**'
              - 'packages/i18n/**'
              - 'packages/test-fixtures/**'
      - if: steps.changes.outputs.api == 'true' || github.event_name == 'push'
        uses: ./.github/actions/setup
      - if: steps.changes.outputs.api == 'true' || github.event_name == 'push'
        run: pnpm turbo run test:int --filter=@polechamp/api
      - name: Raport JUnit
        if: always() && (steps.changes.outputs.api == 'true' || github.event_name == 'push')
        uses: dorny/test-reporter@v2
        with:
          name: integration
          path: apps/api/reports/int.xml
          reporter: java-junit
