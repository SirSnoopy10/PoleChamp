# Środowisko lokalne backendu (IMP-006): PostgreSQL 18, Valkey 8, MinIO (eksporty PDF), Mailpit (e-maile).
# Uruchomienie: docker compose up -d && pnpm --filter @polechamp/api migrate (szczegóły w apps/api/README.md).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polechamp
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d polechamp']
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      retries: 30

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: polechamp
      MINIO_ROOT_PASSWORD: polechamp-dev
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 polechamp polechamp-dev; do sleep 1; done;
      mc mb --ignore-existing local/exports"

  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  miniodata:
