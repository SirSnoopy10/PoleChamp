# TC-E2E-ORG-015, 018, 019, 023, 025, 026 – kategoria „Pole Sport Advanced” turnieju t1 (FX-SEED,
# FX-T1C3, Tablet stół 2 z 3 niewysłanymi ocenami). Uruchamiane w IMP-459.
appId: app.polechamp
---
- launchApp
- extendedWaitUntil:
    visible: 'Mistrzostwa Polski Pole Sport 2026'
    timeout: 8000
- tapOn: 'Mistrzostwa Polski Pole Sport 2026'
- tapOn: 'Pole Sport Advanced'
# Kryteria (zablokowane w Trwa)
- assertVisible: 'Maksymalny wynik sędziego: 65 pkt'
- assertVisible: 'Kryteria są zablokowane po rozpoczęciu kategorii.'
# Zawodniczki
- tapOn: 'Zawodniczki.*'
- assertVisible: 'Lista startowa'
# Wyniki
- tapOn: 'Wyniki'
- assertVisible: 'Ranking na żywo'
- assertVisible: '.*Remis rozstrzyga wyższa ocena za Technikę.'
# Blokada z ostrzeżeniem
- tapOn:
    id: 'category-action-lock'
- assertVisible: 'Tablet stół 2 – 3 niewysłane oceny'
- tapOn: 'Anuluj'
- tapOn:
    id: 'category-action-lock'
- tapOn:
    id: 'lock-force'
- assertVisible: 'Kategoria zakończona'
- tapOn:
    id: 'category-action-unlock'
- assertVisible: 'Kategoria odblokowana'
# PDF
- tapOn:
    id: 'category-action-exportPdf'
- assertVisible: 'Pole Sport Advanced · Trwa'
- tapOn:
    id: 'pdf-download'
- extendedWaitUntil:
    visible: 'PDF zapisany'
    timeout: 10000
