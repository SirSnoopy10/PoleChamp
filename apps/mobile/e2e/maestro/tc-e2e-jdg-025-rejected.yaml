# TC-E2E-JDG-025 / TC-SYNC-007 – odrzucone oceny na tablecie (kategoria zablokowana podczas offline).
# Stan wstępny przygotowuje organizator (blokada c3 przy tablecie offline z 3 ocenami w kolejce);
# sędzia zalogowany, otwarta kolejka c3.
appId: app.polechamp
---
- launchApp
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible:
      id: 'queue-rejected-banner'
    timeout: 30000
- assertVisible: '3 oceny nie zostały przyjęte – kategoria zablokowana'
- assertVisible:
    id: 'queue-state-rejected'
- assertVisible:
    id: 'sync-pill-attention'
- tapOn:
    id: 'queue-rejected-banner'
- assertVisible:
    id: 'sync-popover'
- assertVisible:
    id: 'sync-rejected'
- assertVisible: 'Organizator zdecyduje o ich uwzględnieniu.'
