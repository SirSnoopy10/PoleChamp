# TC-E2E-ORG-006 – reset hasła: formularz, potem link uniwersalny z e-maila (token z Mailpit: E2E_RESET_TOKEN).
# Uruchamiane w IMP-459 (iOS i Android).
appId: app.polechamp
---
- launchApp:
    clearState: true
- tapOn: 'Jestem organizatorem'
- tapOn:
    id: 'login-forgot'
- tapOn:
    id: 'forgot-email'
- inputText: ${E2E_EMAIL}
- tapOn:
    id: 'forgot-submit'
- assertVisible: 'Jeśli konto istnieje, wysłaliśmy link do zmiany hasła.'
- openLink: https://polechamp.app/reset?token=${E2E_RESET_TOKEN}
- tapOn:
    id: 'reset-password'
- inputText: ${E2E_NEW_PASSWORD}
- tapOn:
    id: 'reset-submit'
- extendedWaitUntil:
    visible:
      id: 'login-screen'
    timeout: 5000
- tapOn:
    id: 'login-email'
- inputText: ${E2E_EMAIL}
- tapOn:
    id: 'login-password'
- inputText: ${E2E_NEW_PASSWORD}
- tapOn:
    id: 'login-submit'
- extendedWaitUntil:
    notVisible:
      id: 'login-screen'
    timeout: 8000
