# TC-E2E-ORG-006 – reset hasła: link uniwersalny otwiera ekran nowego hasła (deep link z kodem z e-maila).
appId: app.polechamp
tags: [nightly, org]
---
- runFlow:
    file: ../_shared/seed.yaml
    env:
      FIXTURE: FX-EMPTY
- launchApp:
    clearState: true
- tapOn:
    id: 'mode-org'
- tapOn:
    id: 'login-forgot'
- tapOn:
    id: 'forgot-email'
- inputText: ${output.email}
- tapOn:
    id: 'forgot-submit'
- assertVisible:
    id: 'forgot-sent'
- runScript:
    file: ../_shared/api.js
    env:
      ACTION: last-email-code
      EMAIL: ${output.email}
- openLink: 'https://polechamp.app/reset?token=${output.emailCode}'
- extendedWaitUntil:
    visible:
      id: 'reset-screen'
    timeout: 6000
- tapOn:
    id: 'reset-password'
- inputText: 'Nowe-Haslo-Rura-2026'
- tapOn:
    id: 'reset-submit'
- tapOn:
    id: 'login-email'
- inputText: ${output.email}
- tapOn:
    id: 'login-password'
- inputText: 'Nowe-Haslo-Rura-2026'
- tapOn:
    id: 'login-submit'
- extendedWaitUntil:
    visible:
      id: 'tournaments-screen'
    timeout: 8000
