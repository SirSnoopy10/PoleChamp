# TC-E2E-ORG-001 – pierwsze uruchomienie: wybór trybu, tryb zapamiętany po restarcie.
appId: app.polechamp
tags: [p1, nightly, org]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'mode-screen'
    timeout: 8000
- assertVisible: 'Panel sędziego wymaga tabletu.'
- tapOn:
    id: 'mode-org'
- assertVisible:
    id: 'login-screen'
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'login-screen'
    timeout: 8000
- assertNotVisible:
    id: 'mode-screen'
