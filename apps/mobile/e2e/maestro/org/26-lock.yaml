# TC-E2E-ORG-026 – „Zakończ i zablokuj” z ostrzeżeniem o brakach (c3: 15 brakujących ocen), potem odblokowanie.
# Niewysłane oceny „Tablet stół 2” wymagają tabletu offline z kolejką – sprawdzane w full/ (IMP-457).
appId: app.polechamp
tags: [p1, nightly, org]
---
- runFlow: ../_shared/seed.yaml
- runFlow: ../_shared/login-org.yaml
- tapOn:
    id: 'tournament-${output.ids.t1}'
- tapOn:
    id: 'category-${output.ids.c3}'
- tapOn:
    id: 'category-action-lock'
- assertVisible:
    id: 'lock-sheet'
- assertVisible: 'Brakuje 15 ocen. Wyniki zostaną zapisane jako ostateczne.'
- tapOn: 'Anuluj'
- tapOn:
    id: 'category-action-lock'
- tapOn:
    id: 'lock-force'
- assertVisible: 'Kategoria zakończona'
- tapOn:
    id: 'category-action-unlock'
- assertVisible: 'Kategoria odblokowana'
- assertVisible: 'Trwa'
