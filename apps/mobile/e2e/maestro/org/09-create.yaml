# TC-E2E-ORG-009 – utworzenie turnieju z walidacją nazwy.
appId: app.polechamp
tags: [p1, nightly, org]
---
- runFlow:
    file: ../_shared/seed.yaml
    env:
      FIXTURE: FX-EMPTY
- runFlow: ../_shared/login-org.yaml
- tapOn:
    id: 'tournaments-new'
- tapOn:
    id: 'tournament-create'
- assertVisible: 'Podaj nazwę turnieju (min. 3 znaki).'
- tapOn:
    id: 'tournament-name'
- inputText: 'Puchar Wiosny PoleChamp'
- tapOn:
    id: 'tournament-create'
- assertVisible: 'Utworzono turniej'
- assertVisible: 'Data do ustalenia'
- assertVisible: 'Miejsce do ustalenia'
