# TC-E2E-JDG-022 – pigułka i popover: 3 oceny offline → „Synchronizuj teraz” → „Wysłano”.
appId: app.polechamp
tags: [p1, nightly, judge]
---
- runFlow: ../_shared/tablet-ja.yaml
- tapOn:
    id: 'category-${output.ids.c5}'
- setAirplaneMode: enabled
- repeat:
    times: 3
    commands:
      - tapOn:
          id: 'score-submit'
- assertVisible:
    id: 'sync-pill-offlineQueue'
- tapOn:
    id: 'sync-pill'
- assertVisible:
    id: 'sync-popover'
- setAirplaneMode: disabled
- tapOn:
    id: 'sync-now'
- extendedWaitUntil:
    visible:
      id: 'sync-pill-synced'
    timeout: 20000
