# TC-E2E-JDG-001 – parowanie kodem QR: link `polechamp://pair?code=…` (to samo co skan QR) i etapy ładowania.
appId: app.polechamp
tags: [p1, nightly, judge]
---
- runFlow: ../_shared/seed.yaml
- runScript:
    file: ../_shared/api.js
    env:
      ACTION: pairing-code
      TOURNAMENT: t1
- launchApp:
    clearState: true
    permissions:
      camera: allow
- tapOn:
    id: 'mode-judge'
- openLink: 'polechamp://pair?code=${output.pairingCode}'
- tapOn:
    id: 'pair-device-name'
- inputText: 'Tablet stół 1'
- tapOn:
    id: 'pair-connect'
- assertVisible: 'Łączenie z turniejem…'
- extendedWaitUntil:
    visible:
      id: 'profiles-screen'
    timeout: 20000
- assertVisible: 'Mistrzostwa Polski Pole Sport 2026'
