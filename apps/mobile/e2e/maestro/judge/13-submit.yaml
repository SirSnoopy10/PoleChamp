# TC-E2E-JDG-013 – „Zatwierdź i dalej”: toast z nazwiskiem, auto-przejście do następnej nieocenionej.
appId: app.polechamp
tags: [p1, nightly, judge]
---
- runFlow: ../_shared/tablet-ja.yaml
- tapOn:
    id: 'category-${output.ids.c3}'
- tapOn:
    id: 'queue-row-${output.ids.u27}'
- tapOn:
    id: 'score-submit'
- assertVisible: 'Zapisano ocenę: Lena Mazur'
- assertVisible:
    id: 'score-form'
- extendedWaitUntil:
    visible:
      id: 'queue-state-synced'
    timeout: 5000
