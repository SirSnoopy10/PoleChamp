# TC-E2E-JDG-019…022, 026, 028 – wylogowanie z kolejką, ponowny PIN po tle, popover synchronizacji,
# urządzenie odłączone, nakładka orientacji. Sędzia zalogowany, 2 oceny w kolejce (offline).
appId: app.polechamp
---
- launchApp
- setAirplaneMode: enabled
# TC-E2E-JDG-022: popover i „Synchronizuj teraz”.
- tapOn:
    id: 'sync-pill'
- assertVisible:
    id: 'sync-popover'
- assertVisible: 'Połączenie: offline'
- tapOn:
    id: 'sync-popover-backdrop'
# TC-E2E-JDG-028: obrót do pionu – nakładka, formularz zachowany.
- setOrientation: PORTRAIT
- assertVisible: 'Obróć tablet do pozycji poziomej.'
- setOrientation: LANDSCAPE
- assertNotVisible:
    id: 'orientation-overlay'
# TC-E2E-JDG-019: wylogowanie z niewysłanymi ocenami.
- tapOn:
    id: 'judge-logout'
- assertVisible: 'Wylogować się?'
- tapOn: 'Anuluj'
- tapOn:
    id: 'judge-logout'
- tapOn:
    id: 'logout-confirm'
- assertVisible:
    id: 'profiles-screen'
- setAirplaneMode: disabled
# TC-E2E-JDG-026: organizator odłącza tablet (krok ręczny) – SCR-JDG-10.
- extendedWaitUntil:
    visible:
      id: 'revoked-screen'
    timeout: 60000
- assertVisible: 'To urządzenie zostało odłączone od turnieju'
- assertVisible:
    id: 'revoked-pair'
