- tapOn:
    id: 'score-submit'
- tapOn:
    id: 'untouched-confirm'
    optional: true
- tapOn:
    id: 'judge-logout'
- assertVisible:
    id: 'logout-dialog'
- tapOn: 'Anuluj'
- assertVisible:
    id: 'queue-panel'
- tapOn:
    id: 'judge-logout'
- tapOn:
    id: 'logout-confirm'
- assertVisible:
