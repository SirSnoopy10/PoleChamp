# TC-E2E-ORG-028, 030, 032, 033 – sędziowie (turniej t2), parowanie, tryb samolotowy, konto.
# Uruchamiane w IMP-459 (tryb samolotowy: `setAirplaneMode` – tylko Android).
appId: app.polechamp
---
- launchApp
- extendedWaitUntil:
    visible: 'Puchar Wiosny PoleChamp'
    timeout: 8000
- tapOn: 'Puchar Wiosny PoleChamp'
- tapOn: 'Sędziowie.*'
# TC-E2E-ORG-028
- tapOn: 'Dodaj'
- tapOn:
    id: 'judge-name'
- inputText: 'Katarzyna Nowak'
- tapOn:
    id: 'judge-save'
- assertVisible: 'Zapisz PIN – nie będzie można go ponownie wyświetlić.'
- tapOn:
    id: 'pin-copy'
- assertVisible: 'Skopiowano PIN'
- tapOn:
    id: 'pin-done'
# TC-E2E-ORG-030 (część organizatora)
- tapOn:
    id: 'pair-tablet'
- assertVisible: 'Kod ważny jeszcze.*'
- tapOn:
    id: 'pair-done'
# TC-E2E-ORG-032
- setAirplaneMode: enabled
- back
- assertVisible: 'Brak połączenia — dane mogą być nieaktualne. Zmiany są niedostępne.'
- setAirplaneMode: disabled
# TC-E2E-ORG-033
- back
- tapOn:
    id: 'tournaments-account'
- tapOn: 'Regulamin'
- back
- tapOn:
    id: 'account-logout'
- assertVisible:
    id: 'login-screen'
