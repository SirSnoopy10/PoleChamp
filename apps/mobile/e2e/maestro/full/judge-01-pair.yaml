# TC-E2E-FULL-002 – tablet: parowanie kodem z API (ten sam turniej co na telefonie), logowanie jA.
appId: app.polechamp
tags: [full]
---
- runScript:
    file: ../_shared/full-api.js
    env:
      ACTION: pairing-code
- launchApp:
    clearState: true
- tapOn:
    id: 'mode-judge'
- tapOn:
    id: 'pair-code'
- inputText: ${output.pairingCode}
- tapOn:
    id: 'pair-device-name'
- inputText: 'Tablet stół 1'
- tapOn:
    id: 'pair-connect'
- extendedWaitUntil:
    visible:
      id: 'profiles-screen'
    timeout: 20000
- tapOn:
    id: 'profile-${ID_jA}'
- tapOn: { id: 'pin-key-${PIN_jA.charAt(0)}' }
- tapOn: { id: 'pin-key-${PIN_jA.charAt(1)}' }
- tapOn: { id: 'pin-key-${PIN_jA.charAt(2)}' }
- tapOn: { id: 'pin-key-${PIN_jA.charAt(3)}' }
- extendedWaitUntil:
    visible:
      id: 'categories-screen'
    timeout: 10000
