# TC-E2E-JDG-009…016 – kategorie, kolejka, formularz oceny, zatwierdzenie z auto-przejściem, poprawa
# oceny i podgląd kategorii zablokowanej. FX-TABLET-JA, sędzia zalogowany (flow tc-e2e-jdg-001-008).
appId: app.polechamp
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'categories-screen'
    timeout: 10000
# TC-E2E-JDG-009: kategoria W przygotowaniu – toast bez nawigacji.
- tapOn: 'Pole Art Beginner'
- assertVisible: 'Ta kategoria jeszcze się nie rozpoczęła'
- tapOn: 'Pole Sport Advanced'
# TC-E2E-JDG-010: kolejka i pusty panel prawy.
- assertVisible:
    id: 'queue-panel'
- assertVisible: 'Wybierz zawodniczkę z listy, aby ją ocenić.'
- tapOn:
    id: 'queue-row-.*'
    index: 0
# TC-E2E-JDG-011 / 012: wartości domyślne, −/+, kary, wynik na żywo.
- assertVisible:
    id: 'score-form'
- assertVisible: 'Twój wynik'
- tapOn:
    id: 'criterion-.*-plus'
    index: 0
- tapOn:
    id: 'penalty-.*-plus'
    index: 0
- assertVisible:
    id: 'penalty-chip'
# TC-E2E-JDG-013: zatwierdzenie i przejście do następnej nieocenionej.
- tapOn:
    id: 'score-submit'
- assertVisible: 'Zapisano ocenę: .*'
- assertVisible:
    id: 'score-form'
# TC-E2E-JDG-015: poprawa własnej oceny.
- tapOn:
    id: 'queue-row-.*'
    index: 0
- assertVisible:
    id: 'badge-scored'
- assertVisible: 'Zaktualizuj ocenę'
# TC-E2E-JDG-016: organizator blokuje kategorię (krok ręczny / API) – podgląd bez stopki.
- extendedWaitUntil:
    visible:
      id: 'queue-locked-banner'
    timeout: 60000
- assertNotVisible:
    id: 'score-footer'
