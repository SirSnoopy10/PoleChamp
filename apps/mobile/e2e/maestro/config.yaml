# Maestro CLI 2.11 (IMP-454). Uruchamianie: `maestro test apps/mobile/e2e/maestro --include-tags p1`.
# Przepływy w podkatalogach: org (telefon organizatora), judge (tablet), full (dwa urządzenia), sync (offline),
# ux (regresja raportu UX – EP-16, IMP-714).
flows:
  - 'smoke.yaml'
  - 'org/*'
  - 'judge/*'
  - 'sync/*'
  - 'ux/*'
# Przepływy dwuurządzeniowe (full/) uruchamia orkiestrator `tools/e2e` – nie wchodzą do zwykłego przebiegu.
excludeTags:
  - manual
  - full
executionOrder:
  continueOnFailure: true
testOutputDir: ../../reports/maestro
