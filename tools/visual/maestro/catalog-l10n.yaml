# IMP-504 (TC-L10N-002, TC-A11Y-007/008) – sekcje DevCatalog z pseudolokalizacją (+40%) i czcionką 130%,
# zrzuty `<sekcja>__pseudo130__<DEVICE>.png`. Przełączniki paska katalogu (testID `catalog-toggle-*`)
# (tryb sędziego ogranicza skalę do 120% – `MAX_FONT_SCALE`).
appId: app.polechamp
env:
  DEVICE: phone
---
- launchApp:
    clearState: true
- openLink: 'polechamp://catalog/buttons'
- tapOn:
    id: 'catalog-toggle-pseudo'
- tapOn:
    id: 'catalog-toggle-fontScale-1.3'
- runFlow:
    file: catalog-l10n-section.yaml
    env: { SECTION: buttons }
- runFlow:
    file: catalog-l10n-section.yaml
    env: { SECTION: status }
- runFlow:
    file: catalog-l10n-section.yaml
    env: { SECTION: cards }
- runFlow:
    file: catalog-l10n-section.yaml
    env: { SECTION: sheets }
- runFlow:
    file: catalog-l10n-section.yaml
    env: { SECTION: forms }
- runFlow:
    file: catalog-l10n-section.yaml
    env: { SECTION: feedback }
- runFlow:
    file: catalog-l10n-section.yaml
    env: { SECTION: layout }
- runFlow:
    file: catalog-l10n-section.yaml
    env: { SECTION: tournaments }
- runFlow:
    file: catalog-l10n-section.yaml
    env: { SECTION: org }
- runFlow:
    file: catalog-l10n-section.yaml
    env: { SECTION: judge }
