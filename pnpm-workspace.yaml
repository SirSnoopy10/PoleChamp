packages:
  - apps/*
  - packages/*
  - tools/*

# Skrypty instalacyjne zależności: tylko te, które budują binaria natywne potrzebne projektowi.
allowBuilds:
  lefthook: true
  '@swc/core': true
  argon2: true
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  msgpackr-extract: false
