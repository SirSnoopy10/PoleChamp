packages:
  - apps/*
  - packages/*
  - tools/*

# Skrypty instalacyjne zależności: tylko te, które budują binaria natywne potrzebne projektowi.
allowBuilds:
  lefthook: true
  '@swc/core': true
  argon2: true
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  msgpackr-extract: false
  # Mobile (EP-06): binaria z opcjonalnych pakietów platformowych – skrypty zbędne.
  '@parcel/watcher': false
  unrs-resolver: false
  # Mock expo-sqlite w testach Jest (IMP-201) – binaria w pakiecie (prebuilds/).
  better-sqlite3: false
  # msw: postinstall kopiuje service worker dla przeglądarki – w testach Node zbędny.
  msw: false
